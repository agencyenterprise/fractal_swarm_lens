<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Swarm Lens</title>
    <!-- Plugin modules import shared helpers as "swarm-lens/ui.js"; the map makes them the app's own instances. -->
    <script type="importmap">{ "imports": { "swarm-lens/": "/assets/" } }</script>
    <link rel="icon" href="/assets/logos/swarm-lens.ico?v=2" sizes="any" />
    <script src="/assets/theme.js?v=1"></script>
    <link rel="stylesheet" href="/assets/tailwind.css?v=7" />
    <link rel="modulepreload" href="/assets/app.js?v=19" />
  </head>
  <body>
    <header class="appbar">
      <a class="appbar-brand" href="/" aria-label="Swarm Lens home">
        <picture>
          <source media="(prefers-reduced-motion: reduce)" srcset="/assets/logos/swarm-lens.png?v=2" />
          <img src="/assets/logos/swarm-lens.gif?v=2" width="26" height="26" alt="" decoding="async" />
        </picture><span>Swarm Lens</span>
      </a>
      <span class="appbar-divider" aria-hidden="true"></span>
      <div id="run-select"></div>
      <button id="branch-switch" class="branch-switch ghost" aria-haspopup="menu" aria-expanded="false" data-tip="Switch branch or fork">
        <span aria-hidden="true">⑂</span><span class="label">Recorded</span><span class="count"></span><span aria-hidden="true" class="muted">▾</span>
      </button>
      <nav id="workspace-tabs" class="segmented" role="tablist" aria-label="View"></nav>
      <span class="appbar-spacer"></span>
      <div id="live-controls" class="live-pill" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span id="live-spinner" hidden></span>
        <span id="live-status" role="status">Saved history</span>
        <span id="live-elapsed" class="muted"></span>
        <span id="live-connection" class="muted"></span>
        <label data-tip="Move the cursor to each new event as it arrives"><input id="follow-live" type="checkbox" /> Follow</label>
      </div>
      <div class="appbar-actions">
        <button id="analyze-button" class="ghost" aria-haspopup="menu" aria-expanded="false" hidden>
          Analyze<span class="analyze-active" aria-hidden="true" hidden></span><span aria-hidden="true" class="muted">▾</span>
        </button>
        <button id="fork-button" class="primary" data-tip="Start a new branch after the selected event (F)">Fork here</button>
        <button id="more-button" class="icon ghost" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" data-tip="Import, export, plugins and theme">⋯</button>
      </div>
    </header>

    <div id="execution-notice" class="notice" role="status" aria-live="polite" hidden>
      <span id="execution-notice-text"></span>
      <p id="execution-error" role="alert" hidden></p>
      <button id="view-execution-branch">View branch</button>
      <button id="dismiss-execution-notice" class="icon ghost" aria-label="Dismiss" data-tip="Dismiss">×</button>
    </div>

    <main id="workspace-views">
      <section id="workspace-timeline" class="explorer">
        <section id="timeline" class="timeline" aria-label="Visualization"></section>
        <button id="resize-timeline" class="splitter" aria-label="Resize timeline; use up and down arrow keys"></button>
        <div class="explorer-body">
          <section id="transcript" class="transcript" aria-label="Transcript"></section>
          <button id="resize-inspector" class="splitter vertical" aria-label="Resize inspector; use left and right arrow keys"></button>
          <aside id="inspector" class="inspector" aria-label="Inspector"></aside>
        </div>
      </section>
    </main>

    <dialog id="dialog">
      <form id="dialog-form">
        <div class="dialog-top">
          <div><span id="dialog-kicker" class="kicker"></span><h2 id="dialog-title"></h2></div>
          <button id="close-dialog" type="button" class="icon ghost" aria-label="Close dialog" data-tip="Close (Esc)">×</button>
        </div>
        <div id="dialog-content"></div>
        <div id="dialog-error" role="alert"></div>
        <div class="dialog-actions">
          <button id="cancel-dialog" type="button">Cancel</button>
          <button id="confirm-dialog" class="primary" type="submit">Save</button>
          <button id="alternate-dialog" type="button" hidden></button>
        </div>
      </form>
    </dialog>
    <div id="menu" class="menu" role="menu" hidden></div>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/assets/app.js?v=19"></script>
  </body>
</html>
