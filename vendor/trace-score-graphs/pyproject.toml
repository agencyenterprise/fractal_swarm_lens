[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-score-graphs"
version = "0.1.0"
description = "Independent MAST trace preprocessing and multilayer Jev graph experiment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = ["numpy==1.26.4", "scipy==1.16.0", "scikit-learn==1.7.2", "matplotlib==3.10.7"]

[project.scripts]
trace-score-graphs = "trace_score_graphs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
